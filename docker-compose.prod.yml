# Production-style stack: the app image (built from the Dockerfile) plus a
# Postgres database. For real production prefer a managed database (e.g.
# Supabase/Neon) and point DATABASE_URL/DIRECT_URL at it instead of the db
# service below.
#
#   cp .env.example .env   # then fill in AUTH_SECRET etc.
#   docker compose -f docker-compose.prod.yml up --build
#
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: homefix
      POSTGRES_PASSWORD: homefix
      POSTGRES_DB: homefix
    volumes:
      - homefix_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homefix -d homefix"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # Bake the client DSN / environment into the build (optional).
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      # Override the .env localhost URLs to reach the db service on the network.
      DATABASE_URL: postgresql://homefix:homefix@db:5432/homefix?schema=public
      DIRECT_URL: postgresql://homefix:homefix@db:5432/homefix?schema=public
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  homefix_pgdata_prod:
